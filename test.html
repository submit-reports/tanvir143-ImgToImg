<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Tanvir143 PTI Test</title>
</head>
<body>

<h2>Tanvir143 Image to Image Test</h2>

<input type="file" id="image" accept="image/png,image/jpeg,image/webp">
<br><br>

<textarea id="prompt" placeholder="Enter prompt"></textarea>
<br><br>

<button onclick="generate()">Generate</button>

<pre id="result"></pre>
<img id="output" style="max-width:500px;display:none;">

<script>
async function generate() {
  const file = document.getElementById("image").files[0];
  const prompt = document.getElementById("prompt").value;
  const result = document.getElementById("result");
  const output = document.getElementById("output");

  if (!file || !prompt) {
    result.textContent = "Image and prompt required";
    return;
  }

  const reader = new FileReader();

  reader.onload = async () => {
    result.textContent = "Generating...";

    const imageBase64 = reader.result.split(",")[1];

    try {
      const response = await fetch(
        "https://img-to-img.netlify.app/tanvir/api/image-to-image",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            prompt,
            imageBase64,
            ratio: "auto"
          })
        }
      );

      const data = await response.json();

      result.textContent = JSON.stringify(data, null, 2);

      if (data.success && data.imageUrl) {
        output.src = data.imageUrl;
        output.style.display = "block";
      }

    } catch (error) {
      result.textContent = error.message;
    }
  };

  reader.readAsDataURL(file);
}
</script>

</body>
</html>
